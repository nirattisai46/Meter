<html lang="th">
<head>

<title>แบบฟอร์มมิเตอร์ชำรุด – PEA คำชะอี</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;600;700&display=swap">

<style>
:root{--bg:#f4f1f8;--card:#fff;--tx:#222;--mut:#666;--ac:#6a1b9a;--bd:#d8d2e0;--in:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#17141c;--card:#231f2b;--tx:#eee;--mut:#aaa;--ac:#c58bf0;--bd:#3c3647;--in:#2d2837}}
:root[data-theme="dark"]{--bg:#17141c;--card:#231f2b;--tx:#eee;--mut:#aaa;--ac:#c58bf0;--bd:#3c3647;--in:#2d2837}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 Sarabun,"Noto Sans Thai",Tahoma,sans-serif;padding-bottom:84px}
header{padding:14px 16px 6px}
h1{font-size:19px;margin:0}
header p{margin:2px 0 0;color:var(--mut);font-size:14px}
.tabs{display:flex;gap:8px;padding:8px 16px}
.tabs button{flex:1;padding:9px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font:inherit}
.tabs button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;margin:10px 16px;padding:12px 14px}
.card h2{font-size:16px;margin:0 0 8px;color:var(--ac)}
.row{display:flex;gap:8px;flex-wrap:wrap}
.row>label{flex:1 1 120px}
label{display:block;font-size:13px;color:var(--mut);margin-bottom:8px}
input[type=text],input[type=number],input[type=tel],select{display:block;width:100%;margin-top:3px;padding:9px 10px;font:inherit;font-size:16px;color:var(--tx);background:var(--in);border:1px solid var(--bd);border-radius:9px}
.ck{display:flex;align-items:center;gap:10px;font-size:16px;color:var(--tx);margin:0;padding:7px 0}
.ck input{width:22px;height:22px;accent-color:var(--ac)}
.bar{position:fixed;left:0;right:0;bottom:0;display:flex;gap:8px;padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--bd);z-index:5}
.bar button{padding:12px 9px;font-size:14px;border-radius:11px;border:1px solid var(--bd);background:var(--in);color:var(--tx);font:inherit;font-weight:600}
.bar .pri{flex:1;background:var(--ac);color:#fff;border-color:var(--ac)}
#msg{display:none;position:fixed;left:12px;right:12px;bottom:calc(78px + env(safe-area-inset-bottom,0px));z-index:6;background:#333;color:#fff;border-radius:10px;padding:9px 12px;font-size:14px;text-align:center}
#pv{display:none;padding:8px 0}
#pvbox{margin:0 auto;overflow:hidden;position:relative}
/* ===== document sheet ===== */
#sheet{position:absolute;left:0;top:0;width:794px;height:1122px;background:#fff;color:#000;font:300 14.5px/20px Sarabun,"Noto Sans Thai",Tahoma,sans-serif;transform-origin:0 0;overflow:hidden}
#sheet div,#sheet img{position:absolute}
#sheet .f{height:20px;line-height:20px;text-align:center;white-space:nowrap}
#sheet .f span{display:inline-block;transform-origin:50% 50%}
#sheet .cb{height:20px}
#sheet .cb svg{position:absolute;left:50%;top:1px;margin-left:-9px;width:18px;height:18px;visibility:hidden}
#sheet .cov{background:#fff;display:none}
#sheet .dyn{display:none;white-space:nowrap;height:20px;line-height:20px;transform-origin:0 0}
#sheet .dyn.c{transform-origin:50% 0}
#sheet .dyn.tt{font-weight:700;font-size:21px;line-height:30px;height:30px}
@media print{
 @page{size:A4;margin:0}
 body{background:#fff;padding:0}
 header,.tabs,.bar,#msg,#form{display:none!important}
 #pv{display:block!important;padding:0}
 #pvbox{height:auto!important;width:auto!important;margin:0}
 #sheet{position:relative!important;transform:none!important}
}
</style>

<body>
<header><h1>แบบฟอร์มมิเตอร์ชำรุด</h1><p>การไฟฟ้าส่วนภูมิภาค สาขาอำเภอคำชะอี</p></header>
<div class="tabs"><button id="t1" class="on">กรอกข้อมูล</button><button id="t2">ตัวอย่างเอกสาร</button></div>

<div id="form">
<div class="card"><h2>หน่วยงาน (แก้ไขชื่อได้)</h2>
 <label>ชื่อหน่วยงาน<input data-k="org" type="text"></label>
 <div class="row"><label>สาขา<input data-k="branch" type="text"></label><label>อักษรย่อสาขา (ในช่อง ผจก./หผ.)<input data-k="abbr" type="text"></label></div></div>
<div class="card"><h2>วันที่ตรวจสอบมิเตอร์</h2>
 <div class="row"><label>วันที่<input data-k="d" type="number" inputmode="numeric" min="1" max="31"></label>
 <label>เดือน<select data-k="m" id="mon"></select></label>
 <label>พ.ศ.<input data-k="y" type="number" inputmode="numeric"></label></div></div>

<div class="card"><h2>ผู้ใช้ไฟ</h2>
 <label>หมายเลขผู้ใช้ไฟ<input data-k="ca" type="tel" inputmode="numeric"></label>
 <div class="row"><label>ชื่อ<input data-k="fn" type="text"></label><label>สกุล<input data-k="ln" type="text"></label></div>
 <div class="row"><label>บ้านเลขที่<input data-k="h" type="text"></label><label>หมู่<input data-k="mu" type="text"></label></div>
 <div class="row"><label>ตำบล<input data-k="t" type="text"></label><label>อำเภอ<input data-k="a" type="text"></label></div>
 <label>จังหวัด<input data-k="p" type="text"></label></div>

<div class="card"><h2>มิเตอร์เครื่องเดิม</h2>
 <div class="row"><label>PEA<input data-k="pea" type="text"></label><label>หมายเลขเครื่อง<input data-k="sn" type="text"></label></div>
 <div class="row"><label>ขนาด (แอมป์)<input data-k="amp" type="text"></label><label>เฟส<input data-k="ph" type="text"></label><label>สาย<input data-k="w" type="text"></label></div>
 <div class="row"><label>โวลท์<input data-k="v" type="text"></label><label>ผู้ผลิต<input data-k="mf" type="text"></label></div>
 <label>ตัวเลขที่อ่านได้<input data-k="rd" type="text" inputmode="decimal"></label></div>

<div class="card"><h2>ลักษณะการชำรุด</h2>
 <label class="ck"><input type="checkbox" data-k="c1">ขดลวดทองแดงไหม้ เนื่องจากใช้ไฟเกินพิกัด</label>
 <label class="ck"><input type="checkbox" data-k="c2">ฝาครอบแตก</label>
 <label class="ck"><input type="checkbox" data-k="c3">หมุนถอยหลัง</label>
 <label class="ck"><input type="checkbox" data-k="c4">ตราตะกั่วของมิเตอร์ชำรุด</label>
 <label class="ck"><input type="checkbox" data-k="c5">ตามวาระ</label>
 <label class="ck"><input type="checkbox" data-k="c6">ไม่หมุน</label>
 <label class="ck"><input type="checkbox" data-k="c7">หมุนติดขัด</label>
 <label class="ck"><input type="checkbox" data-k="c8">ช็อตไหม้</label>
 <label class="ck"><input type="checkbox" data-k="c9">อื่นๆ</label>
 <label>ระบุ (อื่นๆ)<input data-k="oth" type="text"></label>
 <div class="row"><label>PEA (ใหม่)<input data-k="pn" type="text"></label><label>หน่วย<input data-k="un" type="text" inputmode="decimal"></label></div></div>

<div class="card"><h2>ค่าใช้จ่ายในการเปลี่ยนมิเตอร์</h2>
 <label class="ck"><input type="radio" name="cost" value="pay" data-k="cost">ต้องเสียค่าใช้จ่าย</label>
 <label>จำนวนเงิน (บาท)<input data-k="amt" type="text" inputmode="decimal"></label>
 <label class="ck"><input type="radio" name="cost" value="free" data-k="cost">ไม่ต้องเสียค่าใช้จ่ายใดๆ</label></div>

<div class="card"><h2>ผู้ลงนาม</h2>
 <label>ผู้ใช้ไฟ / ตัวแทนผู้ใช้มิเตอร์ (นาย/นาง/นางสาว)<input data-k="usr" type="text"></label>
 <label>ผู้ตรวจสอบ<input data-k="insp" type="text"></label>
 <div class="row"><label>พยาน 1 (ฝั่งผู้ใช้ไฟ)<input data-k="w1" type="text"></label><label>พยาน 2 (ฝั่งผู้ตรวจสอบ)<input data-k="w2" type="text"></label></div>
 <div class="row"><label>วันที่ลงนาม<input data-k="sd" type="number" inputmode="numeric" min="1" max="31"></label>
 <label>เดือน<select data-k="sm" class="mon2"></select></label>
 <label>พ.ศ.<input data-k="sy" type="number" inputmode="numeric"></label></div></div>

<div class="card"><h2>ส่วนการเงิน (ถ้ามี)</h2>
 <div class="row"><label>รับชำระเงินเลขที่<input data-k="rc" type="text"></label><label>ลงวันที่<input data-k="rcd" type="text"></label></div></div>
<div class="card"><h2>ตั้งค่าการส่งเข้า Google Sheets</h2>
 <label>URL เว็บแอป Apps Script (ลงท้ายด้วย /exec)<input id="surl" type="text" inputmode="url" placeholder="https://script.google.com/macros/s/.../exec"></label>
 <button id="tst" type="button" style="padding:9px 14px;border-radius:9px;border:1px solid var(--bd);background:var(--in);color:var(--tx);font:inherit">ทดสอบการเชื่อมต่อ</button></div>
</div>

<div id="pv"><div id="pvbox"><div id="sheet"></div></div></div>
<div id="msg"></div>

<div class="bar"><button id="clr">ล้าง</button><button id="prt">พิมพ์</button><button id="snd">ส่งเข้า Sheets</button><button class="pri" id="pdf">ดาวน์โหลด PDF</button></div>

function fitAll(root){
 root.querySelectorAll('.f').forEach(e=>{const s=e.firstChild;s.style.transform='';const W=e.offsetWidth-10,n=s.offsetWidth;if(n>0&&n>W)s.style.transform='scaleX('+Math.max(0.45,W/n)+')'});
 root.querySelectorAll('.dyn').forEach(e=>{if(e.style.display==='none')return;const c=e.dataset.c==='c',b=c?'translateX(-50%)':'';e.style.transform=b;const n=e.offsetWidth,m=+e.dataset.max;if(n>m)e.style.transform=b+' scaleX('+(m/n)+')'});
}
function show(list,on){list.forEach(e=>{e.style.display=on?'block':'none'})}
function render(){
 if(!built)build();
 FE.forEach(([e,k])=>{e.firstChild.textContent=v(k)});
 CE.forEach(([e,k])=>{const i=k.indexOf(':'),on=i>0?S[k.slice(0,i)]===k.slice(i+1):!!S[k];e.firstChild.style.visibility=on?'visible':'hidden'});
 const org=v('org'),br=v('branch'),ab=v('abbr');
 const t=[org,br].filter(Boolean).join(' '),tch=t!==DEF.org+' '+DEF.branch;
 show([TC,TT],tch);TT.textContent=t;
 const pch=org!==DEF.org||br!==DEF.branch;
 show([LC,LT],pch);LT.textContent='ติดต่อที่สำนักงาน'+t;
 AB.forEach(([c,tx,pre])=>{show([c,tx],ab!==DEF.abbr);tx.textContent=pre+ab});
 fitAll($('#sheet'));
 fit();
}
const reRender=()=>{if($('#pv').style.display==='block')render()};

if(document.fonts&&document.fonts.addEventListener)document.fonts.addEventListener('loadingdone',reRender);
function fit(){
 const box=$('#pvbox'),sh=$('#sheet');
 const w=Math.min(window.innerWidth-16,794),sc=w/794;
 box.style.width=w+'px';
 sh.style.transform=`scale(${sc})`;
 box.style.height=(sh.offsetHeight*sc)+'px';
}
window.addEventListener('resize',fit);

function tab(n){
 $('#form').style.display=n===1?'block':'none';
 $('#pv').style.display=n===2?'block':'none';
 $('#t1').classList.toggle('on',n===1);$('#t2').classList.toggle('on',n===2);
 if(n===2)render();
 window.scrollTo(0,0);
}
$('#t1').onclick=()=>tab(1);$('#t2').onclick=()=>tab(2);
const msg=t=>{const m=$('#msg');m.textContent=t;m.style.display=t?'block':'none'};

$('#clr').onclick=()=>{

  while(pdfObj.internal.getNumberOfPages()>1)pdfObj.deletePage(pdfObj.internal.getNumberOfPages());
  const blob=pdfObj.output('blob');
  const name='แบบฟอร์มมิเตอร์ชำรุด_'+(full('fn','ln')||v('ca')||'ใหม่')+'.pdf';
  let dl=null;
  if(window.claude&&claude.use){try{dl=await claude.use('downloads')}catch(e){}}
  if(dl){await dl.save({filename:name,data:blob})}
  else{const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000)}
  msg('บันทึก PDF เรียบร้อย');
 }catch(e){
  msg('สร้าง PDF ไม่สำเร็จ ลองใช้ปุ่ม “พิมพ์” แทน');
 }finally{if(host)host.remove();btn.disabled=false}
};
// URL ของ Apps Script: ใส่ในช่องตั้งค่าในหน้ากรอกข้อมูล (จำไว้ในเครื่อง) หรือแก้ค่าสำรองด้านล่าง
const DEFAULT_URL='https://script.google.com/macros/s/AKfycbwTQ71sP5iT5aqpbfbRgLCCBmvepP3ILAgFOP8bl7XSydt6B5GazNkaXMiRyAjpDvk/exec';
const UKEY='pea-sheet-url';
const savedUrl=()=>{try{return localStorage.getItem(UKEY)||''}catch(e){return ''}};
const getUrl=()=>(savedUrl()||DEFAULT_URL).trim();
$('#surl').value=savedUrl();
$('#surl').addEventListener('input',e=>{try{localStorage.setItem(UKEY,e.target.value.trim())}catch(x){}});
$('#snd').onclick=async()=>{
 const url=getUrl();
 if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(url)){tab(1);msg('ยังไม่ได้ใส่ URL ที่ถูกต้อง: เลื่อนลงล่างสุดของหน้ากรอกข้อมูล ใส่ URL ที่ลงท้าย /exec ในช่องตั้งค่า');return}
 if(!v('fn')&&!v('ca')){msg('กรอกชื่อหรือหมายเลขผู้ใช้ไฟก่อนส่ง');return}
 if(!confirm('ส่งข้อมูลใบนี้เข้า Google Sheets?'))return;
 const b=$('#snd');b.disabled=true;msg('กำลังส่ง...');
 try{
  const r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(S)});
  const t=(await r.text()).trim();
  if(t==='ok')msg('ส่งสำเร็จ: เพิ่มแถวใหม่ในชีตแล้ว');
  else if(t.startsWith('<'))msg('Google ขอให้ล็อกอิน: ตั้งสิทธิ์เข้าถึงเป็น "ทุกคน" แล้วทำให้ใช้งานได้ใหม่');
  else if(t.startsWith('error'))msg('สคริปต์รายงานข้อผิดพลาด: '+t.slice(0,140)+' (ตรวจว่าเปิด Apps Script จากเมนูส่วนขยายในสเปรดชีตเดียวกัน)');
  else msg('สคริปต์ตอบกลับ: '+t.slice(0,120));
 }catch(e){msg('ไม่ได้รับการยืนยันจากสคริปต์ ตรวจดูในชีตว่ามีแถวใหม่หรือไม่ ถ้าไม่มี ให้ตรวจ URL และสิทธิ์ "ทุกคน"')}
 finally{b.disabled=false}
};
$('#tst').onclick=async()=>{
 const url=getUrl();
 if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(url)){msg('ใส่ URL ที่ลงท้าย /exec ในช่องก่อน');return}
 msg('กำลังทดสอบ...');
 try{const t=(await (await fetch(url)).text()).trim();
  if(t==='ready')msg('เชื่อมต่อสำเร็จ: สคริปต์พร้อมรับข้อมูล');
  else if(t.startsWith('<'))msg('Google ขอให้ล็อกอิน: ตั้งสิทธิ์เข้าถึงเป็น "ทุกคน" แล้วทำให้ใช้งานได้ใหม่');
  else msg('สคริปต์ตอบกลับ: '+t.slice(0,100)+' (อาจเป็นสคริปต์เวอร์ชันเก่า ให้วาง Code.gs ใหม่แล้วทำให้ใช้งานได้เวอร์ชันใหม่)');
 }catch(e){msg('เชื่อมต่อไม่ได้ ตรวจ URL สิทธิ์ "ทุกคน" และอินเทอร์เน็ต')}
};
render();
</script>
